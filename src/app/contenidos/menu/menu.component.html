<div class="menu"
     [ngClass]="bpPantalla">
    <div class="categoria"
         [ngClass]="simplifica(categoria.titulo)"
         [ngStyle]="{'backgroundImage': imagenFondo(categoria.imagen)}"
         *ngFor="let categoria of menu">
        <div class="texto">
            <div class="titulo">
                {{categoria.titulo}}
            </div>
            <div *ngIf="categoria.descripcion"
                 class="descripcion">
                {{categoria.descripcion}}
            </div>
        </div>
        <div class="logo"></div>
        <div class="subcategorias">
            <div class="subcategoria"
                 *ngFor="let subcategoria of categoria.hijos">
                <div class="texto">
                    <div class="titulo">{{subcategoria.titulo}}</div>
                    <div *ngIf="subcategoria.descripcion"
                         class="descripcion">
                        {{subcategoria.descripcion}}
                    </div>
                </div>
                <div class="producto"
                     *ngFor="let producto of subcategoria.hijos">
                    <div class="texto">
                        <div class="titulo">
                            {{producto.titulo}}
                        </div>
                        <div *ngIf="producto.descripcion"
                             class="descripcion">
                            {{producto.descripcion}}
                        </div>
                    </div>
                    <div class="valor">
                        {{producto.valor | currency:'COP':'symbol-narrow':'1.0-0'}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
