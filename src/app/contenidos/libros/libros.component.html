<div class="libros"
     *ngIf="interfaz && libros.length">
  <div class="fichas-libros">
    <ng-container *ngFor="let libro of libros">
      <lt-ficha-libro class="libro"
                      *ngIf="libro.visible"
                      [libro]="libro">
      </lt-ficha-libro>
    </ng-container>
  </div>
</div>
