@if (interfaz) {
<div class="auditorio"
     [ngClass]="bpPantalla">
  <button mat-fab
          [matTooltip]="interfaz.cotizar[idioma]"
          class="cotizar">
    <mat-icon>request_quote</mat-icon>
  </button>
  <mat-sidenav-container>
    <mat-sidenav [mode]="modoDrawer"
                 opened>
      <div class="despliega">
        <button mat-icon-button>
          <mat-icon>menu_open</mat-icon>
        </button>
      </div>
      <mat-nav-list>
        <a routerLink="../especificaciones"
           mat-list-item>
          <mat-icon matListItemIcon>checklist_rtl</mat-icon>
          Especificaciones
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      Main
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
}
