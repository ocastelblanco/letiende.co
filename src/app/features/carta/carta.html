@if (!visible) {
  <app-no-encontrada />
} @else {
  <div class="min-h-screen bg-surface py-8 pr-4 pl-16 sm:pl-20">
    <div class="mx-auto max-w-3xl">
      <h1 class="mb-6 text-3xl font-bold tracking-tight text-primary sm:text-4xl">Carta</h1>
      @if (cartaArmada(); as c) {
        <app-carta-menu-lateral [entradas]="entradas()" />
        <div class="space-y-6">
          @for (card of c.cards; track $index) {
            <app-carta-card [card]="card" />
          }
        </div>
      } @else {
        <p class="text-base text-primary" role="status">
          La carta no está disponible en este momento.
        </p>
      }
    </div>
  </div>
}
