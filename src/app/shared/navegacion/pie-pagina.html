<footer class="bg-primary px-4 py-8 text-neutral">
  <div class="mx-auto flex max-w-6xl flex-col gap-2 text-sm">
    <p class="text-base font-semibold tracking-wider uppercase">Le Tiende</p>

    <p>{{ datosNegocio.direccion }}</p>
    @for (bloque of datosNegocio.horarios; track bloque.diasEs) {
      <p>{{ bloque.diasEs }}: {{ bloque.horarioEs }}</p>
    }
    <p>
      <a
        [href]="datosNegocio.instagram.url"
        target="_blank"
        rel="noopener noreferrer"
        class="text-neutral/70 hover:text-neutral"
        >Instagram: &#64;letiende_parkway</a
      >
    </p>
  </div>
</footer>
