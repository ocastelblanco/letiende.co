<div class="menu-lateral"
     [class]="modoTema() + ' ' + (menuPlegado() ? 'cerrado' : 'abierto') + ' ' + bp()">
  <div class="barra">
    <div class="boton-toggle"
         (click)="toggleMenu()">
      <span class="material-symbols-outlined"
            [innerHTML]="'menu' + (menuPlegado() ? '' : '_open')">
      </span>
    </div>
  </div>
  <div class="items">
    @for (item of datosMenu(); track item.nombre) {
    <a pRipple
       class="item"
       [class.active]="url() === item.enlace"
       routerLinkActive="active"
       [routerLink]="item.enlace"
       [ariaLabel]="item.nombre">
      <div class="item-icono">
        <lt-icono [icono]="item.icono"
                  [fontSize]="'1.5em'" />
      </div>
      <div class="item-titulo">
        <span class="texto"
              [innerHTML]="item.nombre"></span>
      </div>
    </a>
    }
  </div>
</div>
