service: letiende-co

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors: true
  deploymentBucket:
    # Sin este tope, cada despliegue deja su artefacto en S3 para siempre.
    maxPreviousDeploymentArtifacts: 5
  # Nunca el default infinito de CloudWatch Logs — CLAUDE.md §5, A05.
  logRetentionInDays: 14
  # Etiquetado obligatorio: la cuenta AWS es compartida con Ágora, Babel y
  # Comandante — sin esto, Cost Explorer no puede separar el gasto de cada
  # app (CLAUDE.md §5, tabla de "Configuración incorrecta").
  stackTags:
    Proyecto: letiende-co
    Stage: ${sls:stage}
  tags:
    Proyecto: letiende-co
    Stage: ${sls:stage}

package:
  individually: true

functions:
  ssr:
    handler: server/ssr/handler.handler
    role: !GetAtt SsrLambdaRole.Arn
    description: >-
      Renderizado SSR de Angular — todas las rutas salvo /api/contacto
      (tech-specs.md §1). Sin permisos de DynamoDB ni de ningún otro
      servicio de AWS: solo renderiza y lee de Ágora por HTTP.
    memorySize: 512
    environment:
      # Protección SSRF de @angular/ssr (verificado leyendo
      # node_modules/@angular/ssr/fesm2022/node.mjs — getAllowedHostsFromEnv()
      # lee esta variable con prioridad sobre `allowedHosts` de angular.json,
      # que solo trae `localhost` para desarrollo local). Sin ella, cualquier
      # petición real a través de API Gateway responde 400 "Header host...
      # is not allowed" — verificado invocando el handler local con un
      # evento de API Gateway simulado, antes y después de fijar esta
      # variable (docs/MEMORY.md, T-0007). El dominio propio
      # (letiende.co / staging.letiende.co) se agrega en el mismo cambio que
      # lo monte — T-13 —, nunca antes: no hay nada que "permitir" todavía
      # para un host que no resuelve a esta Lambda.
      NG_ALLOWED_HOSTS: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    package:
      patterns:
        - '!**'
        - 'dist/letiende-co/**'
        - 'server/ssr/handler.mjs'
        - 'node_modules/@codegenie/serverless-express/**'
    events:
      - httpApi:
          path: /
          method: get
      - httpApi:
          path: /{proxy+}
          method: '*'

  contacto:
    handler: dist-server-bundle/contacto.handler
    role: !GetAtt ContactoLambdaRole.Arn
    description: >-
      POST /api/contacto — envía el formulario de contacto por SES, con
      honeypot y límite de peticiones por IP (CLAUDE.md §5, A07).
    environment:
      # Dirección verificada de SES — CLAUDE.md §5, A03: el remitente lo fija
      # siempre el servidor, nunca el cuerpo de la petición. Sin el secreto
      # en CI, resuelve a cadena vacía y el envío falla en tiempo de
      # ejecución (con 500, no en silencio) — gotcha ya documentado,
      # docs/MEMORY.md §7.
      SES_REMITENTE: ${env:SES_REMITENTE, ''}
      # Secret key de reCAPTCHA v3 (developers.google.com/recaptcha/docs/v3) —
      # nunca la site key pública, que sí va en el bundle del navegador
      # (src/environments/, con el mismo mecanismo de marcador que Maps/GA4,
      # ADR-017). Sin ella, tokenReCaptchaValido() siempre devuelve false y
      # el envío se rechaza con 400 — no en silencio.
      RECAPTCHA_SECRET_KEY: ${env:RECAPTCHA_SECRET_KEY, ''}
    package:
      # Depende de @aws-sdk/client-ses en tiempo de ejecución — se empaqueta
      # con esbuild (npm run bundle:api, server/bundle-lambdas.mjs), no se
      # copia node_modules/** a mano: el runtime gestionado de nodejs24.x no
      # garantiza traer el SDK v3 modular preinstalado (mismo motivo,
      # verificado en producción en Ágora, docs/MEMORY.md ADR/gotcha T-0009).
      patterns:
        - '!**'
        - 'dist-server-bundle/contacto.js'
    events:
      - httpApi:
          path: /api/contacto
          method: post

resources:
  # T-0011: certificado ACM + distribución de CloudFront + registro DNS de
  # staging. La distribución de producción se crea en el mismo cambio (misma
  # estructura de behaviors, tech-specs.md §7.2) pero SIN alias todavía: no
  # se le puede poner letiende.co/www.letiende.co como Aliases mientras la
  # distribución actual (E33QAN86FY24JZ, docs/MEMORY.md §5) siga teniéndolos
  # — CloudFront no permite el mismo alias en dos distribuciones a la vez.
  # El alias se mueve en el cutover real (T-14/T-15), quitándolo de la vieja
  # y poniéndolo en esta en la misma operación (ADR-006).
  Conditions:
    EsStaging: !Equals ['${sls:stage}', 'staging']

  Resources:
    # us-east-1 obligatorio para CloudFront (tech-specs.md §7.1) — ya es la
    # región de todo el stack (provider.region arriba), así que no hace
    # falta un override. Validación por DNS, automática vía CloudFormation:
    # al declarar HostedZoneId, CloudFormation crea el registro CNAME de
    # validación en Route 53 y espera a que ACM emita el certificado antes
    # de continuar con el resto del stack.
    CertificadoStaging:
      Type: AWS::CertificateManager::Certificate
      Condition: EsStaging
      Properties:
        DomainName: staging.letiende.co
        ValidationMethod: DNS
        DomainValidationOptions:
          - DomainName: staging.letiende.co
            HostedZoneId: Z010633738KAGFIPOZVEW

    DistribucionCloudFront:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: !Sub 'letiende-co ${sls:stage}'
          HttpVersion: http2
          IPV6Enabled: true
          Aliases: !If [EsStaging, ['staging.letiende.co'], !Ref 'AWS::NoValue']
          ViewerCertificate:
            Fn::If:
              - EsStaging
              - AcmCertificateArn: !Ref CertificadoStaging
                SslSupportMethod: sni-only
                MinimumProtocolVersion: TLSv1.2_2021
              - CloudFrontDefaultCertificate: true
          # Los cuatro orígenes de tech-specs.md §7.2. Los endpoints de
          # Ágora/Babel son el execute-api CRUDO de cada stage (verificado
          # contra la cuenta real con apigatewayv2 GetApis el 03/09/2026,
          # coincide con la tabla ya documentada) — nunca agora.letiende.co/
          # babel.letiende.co: esos dominios van a redirigir con 301 hacia
          # letiende.co/cartelera (T-11) y usarlos como origen crearía un
          # bucle infinito (detalle 1 de tech-specs.md §7.2).
          Origins:
            - Id: AgoraOrigin
              DomainName: !If
                - EsStaging
                - ttukw9i82m.execute-api.us-east-1.amazonaws.com
                - qe36b86eb7.execute-api.us-east-1.amazonaws.com
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - Id: BabelOrigin
              DomainName: !If
                - EsStaging
                - oyzau0c910.execute-api.us-east-1.amazonaws.com
                - aav553hwx4.execute-api.us-east-1.amazonaws.com
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            # Mismo bucket en los dos stages (docs/MEMORY.md §5). Reutiliza
            # el Origin Access Control ya existente del bucket
            # (letiende-assets-oac, verificado con
            # cloudfront ListOriginAccessControls) — la política del bucket
            # todavía solo permite a la distribución actual de
            # assets.letiende.co (E3RUGH3MUSR7PS) leerlo; falta ampliarla
            # con los ARNs de estas distribuciones nuevas una vez que
            # existan (acción real pendiente de confirmar, fuera de este
            # stack: el bucket lo gestiona otro estable).
            - Id: AssetsOrigin
              DomainName: letiende-assets.s3.us-east-1.amazonaws.com
              OriginAccessControlId: E3SILMI6I2VBVT
              S3OriginConfig:
                OriginAccessIdentity: ''
            # El API Gateway de este mismo stack — mismo patrón Fn::Join que
            # el Output HttpApiUrl de abajo (evita que el resolvedor de
            # variables de Serverless choque con Fn::Sub, docs/MEMORY.md §7).
            - Id: ContenedorOrigin
              DomainName:
                Fn::Join:
                  - ''
                  - - !Ref HttpApi
                    - '.execute-api.'
                    - !Ref 'AWS::Region'
                    - '.'
                    - !Ref 'AWS::URLSuffix'
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
          # CachingDisabled (4135ea2d-…) y AllViewerExceptHostHeader
          # (b689b0a8-…) son IDs de políticas administradas por AWS, iguales
          # en cualquier cuenta — verificados contra distribuciones reales ya
          # en uso en esta cuenta, no de memoria. AllViewerExceptHostHeader
          # es el detalle 2 de tech-specs.md §7.2: sin reenviar Host, porque
          # API Gateway lo valida contra su propio dominio y responde 403 si
          # llega el del visitante. AllowedMethods completo (no solo GET/
          # HEAD): Ágora hace POST real en el flujo de compra de boletas, y
          # el contenedor recibe POST en /api/contacto — limitarlo a GET
          # rompería ambos silenciosamente.
          DefaultCacheBehavior:
            TargetOriginId: ContenedorOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
          CacheBehaviors:
            - PathPattern: /cartelera/*
              TargetOriginId: AgoraOrigin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
            - PathPattern: /libros/*
              TargetOriginId: BabelOrigin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
            # No hace falta OriginRequestPolicy aquí (no es API Gateway, no
            # valida Host): CachingOptimized de tech-specs.md §7.2, sola.
            - PathPattern: /assets/*
              TargetOriginId: AssetsOrigin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              Compress: true

    # Alias en la zona de producción de Route 53 (Z010633738KAGFIPOZVEW,
    # tech-specs.md §7.1) — la distribución de producción NO gana un
    # registro en este cambio (ver comentario de Conditions arriba): eso es
    # el cutover, T-14/T-15.
    RegistroDnsStaging:
      Type: AWS::Route53::RecordSet
      Condition: EsStaging
      Properties:
        HostedZoneId: Z010633738KAGFIPOZVEW
        Name: staging.letiende.co
        Type: A
        AliasTarget:
          # Zona alias fija de CloudFront, igual para cualquier distribución
          # en cualquier cuenta (verificada contra los registros reales ya
          # existentes de letiende.co/assets.letiende.co en esta misma zona).
          HostedZoneId: Z2FDTNDATAQYW2
          DNSName: !GetAtt DistribucionCloudFront.DomainName
          EvaluateTargetHealth: false

    SsrLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: letiende-co-ssr-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin política adicional (CLAUDE.md §5, A05: mínimo privilegio): el
        # SSR no lee ni escribe en ningún recurso de AWS propio, solo hace
        # una petición HTTP saliente de solo lectura a Ágora
        # (GET /api/eventos-publicos, tech-specs.md §5) — eso no requiere
        # permiso IAM, no es una llamada a un servicio de AWS.

    ContactoLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: letiende-co-contacto-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): ses:SendEmail/SendRawEmail
          # (no ses:*), acotado a la identidad verificada de letiende.co
          # (verificado con la cuenta real: `aws sesv2 list-email-identities`
          # confirma `letiende.co` como dominio verificado, SendingEnabled) —
          # nunca Resource: '*'. Sin ninguna otra política: esta función no
          # lee ni escribe en DynamoDB, S3 ni ningún otro recurso.
          - PolicyName: letiende-co-contacto-ses-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                    - ses:SendRawEmail
                  Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/letiende.co'

  Outputs:
    # Fuente confiable de la URL del endpoint para el smoke test de CI
    # (.github/workflows/deploy.yml) — evita parsear el texto de salida de
    # `serverless deploy`, que en Serverless Framework 4 no siempre llega
    # por stdout (T-0010, docs/MEMORY.md §7).
    HttpApiUrl:
      Description: URL base del endpoint de API Gateway (HTTP API)
      # Fn::Join en vez de !Sub: el resolvedor de variables ${...} de
      # Serverless Framework intenta resolver ${HttpApi}/${AWS::Region} ANTES
      # de que CloudFormation vea el Fn::Sub, y produce un Value con Fn::Join
      # y Fn::Sub mezclados en el mismo mapa — inválido para CloudFormation
      # (gotcha ya verificado en Ágora, mismo patrón, docs/MEMORY.md §7).
      # Fn::Join con !Ref no contiene ningún `${...}`, así que el resolvedor
      # de Serverless no lo toca. AWS::URLSuffix explícito, no el literal
      # '.amazonaws.com': Serverless reescribe automáticamente cualquier
      # Fn::Join que reconoce como URL de API Gateway para usar el
      # pseudo-parámetro dinámico, y si ya hay un '.amazonaws.com' literal en
      # la lista, el suyo se agrega en vez de reemplazarlo.
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - !Ref HttpApi
            - '.execute-api.'
            - !Ref 'AWS::Region'
            - '.'
            - !Ref 'AWS::URLSuffix'

    # Para docs/MEMORY.md §5 ("Configuraciones vigentes") y para configurar
    # a mano CLOUDFRONT_DISTRIBUTION_ID_STAGING/PRODUCTION como secrets de
    # GitHub Actions (tech-specs.md §9) una vez desplegado.
    CloudFrontDistributionId:
      Description: ID de la distribución de CloudFront de este stage
      Value: !Ref DistribucionCloudFront
    CloudFrontDomainName:
      Description: Dominio *.cloudfront.net de la distribución (sin alias todavía en producción)
      Value: !GetAtt DistribucionCloudFront.DomainName
